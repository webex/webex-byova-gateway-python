[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byova-e2e-caller"
version = "0.1.0"
description = "Local Webex Calling test caller for the BYOVA gateway"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "playwright>=1.55,<2",
    "requests>=2.32",
    "soundfile>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
byova-e2e = "byova_e2e.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
