# Webex Contact Center BYOVA Gateway Configuration

# Gateway settings
gateway:
  host: "0.0.0.0"
  port: 50051
  # Long-lived caller streams use a dedicated executor so they cannot starve
  # health and unary RPCs on the shared gRPC worker pool.
  streaming_max_workers: 100
  # Bound per-stream buffering while request ingestion, connector processing,
  # and response delivery run independently.
  request_queue_maxsize: 100
  response_queue_maxsize: 100
  # Safety ceiling for legacy complete-WAV prompt responses. GECX raw CHUNK
  # streaming preserves order without this playback delay.
  max_terminal_playback_seconds: 30

# Voice activity detection controls. The configured detector implementation is internal.
voice_activity_detection:
  threshold: 0.5
  start_debounce_ms: 96
  # One second balances natural pauses with responsive turn-taking for
  # utterance-buffered connectors such as AWS Lex.
  end_silence_ms: 1000
  # GECX can merge speech that resumes within one second after an apparent
  # turn end. Combined with end_silence_ms, this creates a two-second bounded
  # natural-pause window without holding every completed turn indefinitely.
  speech_end_grace_ms: 1000
  # Used only when WxCC omits the mandatory audio_input.sample_rate_hertz field.
  fallback_sample_rate_hertz: 8000

# Connectors configuration
connectors:
  # Local Audio Connector
  local_audio_connector:
    type: "local_audio_connector"
    class: "LocalAudioConnector"
    module: "connectors.local_audio_connector"
    config:
      agent_id: "Local Playback"
      audio_base_path: "audio"
      audio_files:
        welcome: "welcome.wav"
        transfer: "transferring.wav"
        goodbye: "goodbye.wav"
        error: "error.wav"
        default: "default_response.wav"

  # AWS Lex Connector
  aws_lex_connector:
    type: "aws_lex_connector"
    class: "AWSLexConnector"
    module: "connectors.aws_lex_connector"
    config:
      region_name: "us-east-1"

      # Initial trigger text sent when starting a conversation (default: "hello")
      # For Bedrock agents, use a simple greeting rather than a specific request
      # to avoid triggering function calls before the agent is ready
      initial_trigger_text: "hello"

      # Barge-in configuration (default: false)
      # When enabled, users can interrupt the bot's response
      barge_in_enabled: false

      # Audio logging configuration
      audio_logging:
        enabled: true
        output_dir: "logs/audio_recordings"
        filename_format: "{conversation_id}_{timestamp}_{source}.wav"
        log_all_audio: true
        max_file_size: 10485760
        sample_rate: 8000
        bit_depth: 8
        channels: 1
        encoding: "ulaw"
      agents: []

  # Google CX Agent Studio (GECX / CES BidiRunSession)
  # gecx_connector:
  #   type: "gecx_connector"
  #   class: "GECXConnector"
  #   module: "connectors.gecx_connector"
  #   config:
  #     project_id: "YOUR_PROJECT_ID"
  #     location: "us"
  #     application_id: "YOUR_APPLICATION_ID"
  #     # deployment_id is optional; omit it to use the app's root/draft agent.
  #     # deployment_id: "YOUR_DEPLOYMENT_ID"
  #     language_code: "en-US"
  #     input_sample_rate_hertz: 8000
  #     input_audio_encoding: "MULAW"
  #     output_sample_rate_hertz: 8000
  #     output_audio_encoding: "MULAW"
  #     # Suppress only anomalously long low-energy CES pre-roll while retaining
  #     # 100ms before detected prompt speech. Normal short frames pass through.
  #     suppress_long_leading_audio: true
  #     output_leading_audio_min_ms: 5000
  #     output_speech_rms_threshold: 200
  #     output_speech_start_frames: 2
  #     output_speech_preroll_ms: 100
  #     initial_message: "Hello"
  #     enable_partial_responses: true
  #     # Temporary safety switch. When false, no GECX prompt can be
  #     # interrupted during playback. Default: false.
  #     barge_in_enabled: false
  #     force_input_format: "wxcc"
  #     turn_response_timeout_seconds: 30
  #     # Trailing codec silence lets CES reliably endpoint short voice turns.
  #     endpointing_silence_ms: 2000
  #     # Preserve speech before VAD start, merge bounded resumed-speech onset,
  #     # and catch delayed EndSession after TTS.
  #     input_preroll_ms: 500
  #     input_pause_preroll_ms: 250
  #     terminal_response_grace_seconds: 3
  #     # Omit auth settings to use Application Default Credentials.
  #     # service_account_key: "/path/to/service-account.json"
  #     agents:
  #       - "My GECX Agent"

# Monitoring interface
monitoring:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  metrics_enabled: true
  health_check_interval: 30

# Authentication configuration
authentication:
  enabled: true
  environment: "dev"  # Options: "dev" or "production"

  # Session configuration
  session:
    timeout_hours: 24  # Session timeout in hours
    secret_key_env: "FLASK_SECRET_KEY"  # Environment variable for session secret

  # Webex OAuth configuration
  webex_oauth:
    scopes: "openid email profile"
    state: "byova_gateway_auth"

# JWT validation configuration for gRPC requests
jwt_validation:
  # Enable/disable JWT validation (default: true for production security)
  enabled: true
  
  # Enforce validation - if false, invalid tokens are logged but allowed (default: true)
  enforce_validation: true
  
  # Datasource URL - must match the URL configured in your Webex Contact Center datasource
  # This should be the publicly accessible URL of your gateway (including port if non-standard)
  # Example: "https://your-gateway-domain.com:443"
  datasource_url: ""
  
  # Datasource schema UUID - typically this is the BYOVA schema UUID
  # This is the schema ID from https://github.com/webex/dataSourceSchemas
  # Path: Services/VoiceVirtualAgent/5397013b-7920-4ffc-807c-e8a3e0a18f43/schema.json
  # Default value is the standard BYOVA schema UUID and should not change unless
  # there is a major modification to the BYOVA schema definition
  datasource_schema_uuid: "5397013b-7920-4ffc-807c-e8a3e0a18f43"
  
  # Cache duration for public keys in minutes (default: 60)
  # Public keys are fetched from Webex identity broker and cached to improve performance
  cache_duration_minutes: 60

# BYODS datasource registration and token lifecycle
data_source:
  # Enable to discover/register this gateway with Webex at startup and renew
  # its JWS before expiration.
  enabled: false

  # Stop gateway startup if registration or initial renewal fails.
  fail_startup_on_error: true

  # Optional existing datasource ID. When empty, the gateway discovers a
  # matching datasource or registers one. id_env takes precedence when id is empty.
  id: ""
  id_env: "WEBEX_BYODS_DATA_SOURCE_ID"

  # Leave URL and schema empty to reuse the JWT validation values above.
  # If explicitly configured, they must exactly match the JWT values.
  url: ""
  schema_id: ""
  audience: "BYOVAGateway"
  subject: "callAudioData"

  # Webex supports a maximum JWS lifetime of 1440 minutes (24 hours).
  token_lifetime_minutes: 1440
  renewal_lead_time_minutes: 60
  retry_interval_seconds: 60

  # The SDK reads credential values from these environment variables. An OAuth
  # refresh token supports unattended access-token renewal. A static access
  # token can be used for short-lived development by setting type: "static"
  # and access_token_env: "WEBEX_BYODS_ACCESS_TOKEN".
  auth:
    type: "oauth_refresh"
    client_id_env: "WEBEX_BYODS_CLIENT_ID"
    client_secret_env: "WEBEX_BYODS_CLIENT_SECRET"
    refresh_token_env: "WEBEX_BYODS_REFRESH_TOKEN"

# Logging configuration
logging:
  gateway:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "logs/gateway.log"
    max_size: "10MB"
    backup_count: 5

  web:
    level: "WARNING"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    file: "logs/web.log"
    max_size: "5MB"
    backup_count: 3

# Session management
sessions:
  timeout: 600
  max_sessions: 1000
  cleanup_interval: 60
  enable_auto_cleanup: true
  max_session_duration: 3600

# Audio processing
audio:
  supported_formats:
    - "wav"
    - "mp3"
    - "flac"
    - "ogg"
