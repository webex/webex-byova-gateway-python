# Container-only smoke configuration.
#
# This deliberately disables datasource registration and JWT validation. Use it
# only for an isolated local container or an ECS task that is not attached to a
# public listener. Supply the real dev configuration through
# GATEWAY_CONFIG_S3_URI before any traffic cutover.
gateway:
  host: "0.0.0.0"
  port: 50051
  streaming_max_workers: 10
  request_queue_maxsize: 20
  response_queue_maxsize: 20
  max_terminal_playback_seconds: 5

transports:
  mode: "both"
  allow_partial_transport_startup: false
  websocket:
    host: "0.0.0.0"
    port: 8765
    first_message_timeout_seconds: 10
    discovery_idle_timeout_seconds: 5
    terminal_flush_timeout_seconds: 2
    terminal_peer_close_timeout_seconds: 30
    queue_maxsize: 20
    queue_put_timeout_seconds: 1
    max_message_bytes: 131072
    connector_max_workers: 4
    connector_max_pending: 4
    output_chunk_bytes: 3200
    allow_unauthenticated_local_dev: true

voice_activity_detection:
  threshold: 0.5
  start_debounce_ms: 96
  end_silence_ms: 1000
  speech_end_grace_ms: 1000
  fallback_sample_rate_hertz: 8000

connectors:
  local_audio_connector:
    type: "local_audio_connector"
    class: "LocalAudioConnector"
    module: "connectors.local_audio_connector"
    supported_transports: ["grpc", "websocket"]
    config:
      agent_id: "Container Smoke Agent"
      audio_base_path: "audio"
      audio_files:
        welcome: "welcome.wav"
        transfer: "transferring.wav"
        goodbye: "goodbye.wav"
        error: "error.wav"
        default: "default_response.wav"

monitoring:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  debug: false

jwt_validation:
  enabled: false

websocket_jwt_validation:
  enabled: false

data_source:
  enabled: false

websocket_data_source:
  enabled: false

logging:
  gateway:
    level: "INFO"
    file: ""
  web:
    level: "WARNING"
    file: ""
